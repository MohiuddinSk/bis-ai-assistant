name: Quality gates

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RETRIEVAL_PROVIDER: disabled
      LLM_PROVIDER: disabled
      GROQ_API_KEY: ""
      GROQ_MODEL: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LLM_ALLOWED_HOSTS: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci-light.txt
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-light.txt
          python -m compileall -q backend retrieval
          python -m unittest -v \
            tests.test_api \
            tests.test_chat_api \
            tests.test_chat_understanding_api \
            tests.test_compliance_api \
            tests.test_container_configuration \
            tests.test_cors_settings \
            tests.test_data_contract \
            tests.test_documents \
            tests.test_generation_factory \
            tests.test_guided_fact_plan \
            tests.test_openai_compatible_generator \
            tests.test_personalized_assistant \
            tests.test_provider_disabled_api \
            tests.test_question_understanding \
            tests.test_retrieval_disabled_api \
            tests.test_retrieval_factory \
            tests.test_retrieval_provider_contract \
            tests.test_standard_explanation.StandardExplanationApiTests \
            tests.test_standard_explanation.StandardExplanationUnderstandingGuardTests \
            tests.test_ci_artifacts \
            tests.test_ci_configuration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test, and build
        run: |
          npm ci
          npm run lint
          npm run test -- --run
          npm run build

  data-and-configuration:
    name: Data and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci-light.txt
      - name: Validate artifacts and configuration
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.6 pypdf==6.10.0 PyYAML==6.0.3
          python scripts/check_ci_artifacts.py
          python -m unittest -v \
            tests.test_data_contract \
            tests.test_container_configuration \
            tests.test_ci_artifacts \
            tests.test_ci_configuration
          git diff --check
          git diff --exit-code
